<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 390" width="680" height="390" role="img" aria-label="Taux d'erreur">
<style>svg{--surface:#fcfcfb;--texte:#0b0b0b;--texte2:#52514e;--discret:#898781;--grille:#e1e0d9;--axe:#c3c2b7;--vm:#2a78d6;--docker:#eb6834;font-family:system-ui,-apple-system,'Segoe UI',sans-serif}@media (prefers-color-scheme:dark){svg{--surface:#1a1a19;--texte:#f0efec;--texte2:#c3c2b7;--discret:#898781;--grille:#2c2c2a;--axe:#383835;--vm:#3987e5;--docker:#d95926;}}.t{fill:var(--texte)}.t2{fill:var(--texte2)}.m{fill:var(--discret);font-variant-numeric:tabular-nums}</style>
<rect width="680" height="390" fill="var(--surface)"/>
<text x="64" y="28" class="t" font-size="16" font-weight="600">Taux d'erreur</text>
<text x="64" y="48" class="t2" font-size="12">Série « controle-2 », fenêtre de mesure de chaque palier</text>
<line x1="64" x2="548" y1="342.0" y2="342.0" stroke="var(--grille)" stroke-width="1"/>
<text x="56" y="346.0" class="m" font-size="11" text-anchor="end">0</text>
<line x1="64" x2="548" y1="88.0" y2="88.0" stroke="var(--grille)" stroke-width="1"/>
<text x="56" y="92.0" class="m" font-size="11" text-anchor="end">1</text>
<line x1="64" x2="548" y1="342.0" y2="342.0" stroke="var(--axe)" stroke-width="1"/>
<text x="64.0" y="360" class="m" font-size="11" text-anchor="middle">0</text>
<text x="225.3" y="360" class="m" font-size="11" text-anchor="middle">50</text>
<text x="386.7" y="360" class="m" font-size="11" text-anchor="middle">100</text>
<text x="548.0" y="360" class="m" font-size="11" text-anchor="middle">150</text>
<text x="306.0" y="382" class="t2" font-size="12" text-anchor="middle">utilisateurs simultanés</text>
<text x="14" y="215.0" class="t2" font-size="12" text-anchor="middle" transform="rotate(-90 14 215.0)">%</text>
<path d="M67.2,342.0 L96.3,342.0 L144.7,342.0 L225.3,342.0 L386.7,342.0 L548.0,342.0" fill="none" stroke="var(--docker)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="67.2" cy="342.0" r="4" fill="var(--docker)" stroke="var(--surface)" stroke-width="2"><title>3 conteneurs — 1 utilisateurs : 0 %</title></circle>
<circle cx="96.3" cy="342.0" r="4" fill="var(--docker)" stroke="var(--surface)" stroke-width="2"><title>3 conteneurs — 10 utilisateurs : 0 %</title></circle>
<circle cx="144.7" cy="342.0" r="4" fill="var(--docker)" stroke="var(--surface)" stroke-width="2"><title>3 conteneurs — 25 utilisateurs : 0 %</title></circle>
<circle cx="225.3" cy="342.0" r="4" fill="var(--docker)" stroke="var(--surface)" stroke-width="2"><title>3 conteneurs — 50 utilisateurs : 0 %</title></circle>
<circle cx="386.7" cy="342.0" r="4" fill="var(--docker)" stroke="var(--surface)" stroke-width="2"><title>3 conteneurs — 100 utilisateurs : 0 %</title></circle>
<circle cx="548.0" cy="342.0" r="4" fill="var(--docker)" stroke="var(--surface)" stroke-width="2"><title>3 conteneurs — 150 utilisateurs : 0 %</title></circle>
<line x1="554.0" x2="558" y1="342.0" y2="342.0" stroke="var(--axe)" stroke-width="1"/>
<text x="562" y="346.0" class="t" font-size="12">3 conteneurs : 0</text>
</svg>
