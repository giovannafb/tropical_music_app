# Nginx : fichiers statiques du client, reverse proxy / répartition de charge vers l'API,
# envoi des fichiers audio (X-Accel-Redirect) et des covers.
# Le client ne parle qu'à /api/ : il n'a aucun accès direct à MySQL, Redis ou Elasticsearch.

# « api » est résolu par le DNS Docker : avec « --scale api=3 », les 3 instances sont ajoutées.
upstream api {
    least_conn;
    server api:8000;
}

# Limitation de débit (par adresse IP)
limit_req_zone $binary_remote_addr zone=search:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=mail:10m rate=3r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;

    # Upload d'album : 1 Mo par défaut provoquerait une erreur 413
    client_max_body_size 200M;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;

    location /api/ {
        proxy_pass http://api;
    }

    location = /api/search {
        limit_req zone=search burst=20 nodelay;
        proxy_pass http://api;
    }

    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://api;
    }

    location ~ ^/api/auth/(resend-verification|forgot-password)$ {
        limit_req zone=mail burst=2 nodelay;
        proxy_pass http://api;
    }

    # Fichiers audio : accessibles uniquement via X-Accel-Redirect envoyé par l'API
    # (Nginx gère lui-même les requêtes Range -> 206 Partial Content)
    location /protected-audio/ {
        internal;
        alias /data/audio/;
        types { audio/mpeg mp3; }
    }

    location /covers/ {
        alias /data/covers/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
