<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MusicApp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kaisei+Tokumin:wght@400;500;700;800&display=swap">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/views.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <!-- Une seule page : les vues sont injectées par JavaScript (la musique ne s'arrête jamais). -->
  <div id="app" aria-live="polite"></div>

  <!-- Un seul élément audio global, créé une fois, jamais détruit. -->
  <audio id="audio" preload="none"></audio>

  <div class="toasts" id="toasts" role="status"></div>
</body>
</html>
